# Run the auth gateway in front of an MCP server.
# Agents connect to the gateway (port 3001) only.
#
# The gateway forwards MCP JSON-RPC over HTTP to MCP_UPSTREAM. Note that the
# robinhood-for-agents MCP server itself is stdio-only, so the `mcp` service
# below is a placeholder: supply your own image that exposes the MCP server
# over HTTP on :3000 (e.g. the stdio server behind a stdio<->HTTP MCP bridge).

services:
  mcp:
    # Placeholder — replace with your MCP-over-HTTP image (see note above).
    image: your-mcp-http-image
    expose:
      - "3000"
    environment:
      - ROBINHOOD_ACCESS_TOKEN=${ROBINHOOD_ACCESS_TOKEN}
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "3001:3001"
    environment:
      - GATEWAY_PORT=3001
      - MCP_UPSTREAM=http://mcp:3000
      - AGENT_AUTH_ENABLED=true
      - AGENT_VERIFIER=shared-secret
      # Generate with: openssl rand -hex 32
      - AGENT_AUTH_SECRET=${AGENT_AUTH_SECRET}
    depends_on:
      - mcp
    restart: unless-stopped
